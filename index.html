<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<title>情绪记录</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --sub:#6b7280; --line:#e6e8ec;
    --teal:#0f766e; --teal-soft:#e6f4f2;
    --red:#dc2626; --amber:#d97706; --green:#059669; --violet:#7c3aed;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom));}
  header{position:sticky; top:0; z-index:20; background:rgba(246,247,249,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:calc(10px + env(safe-area-inset-top)) 16px 10px;}
  .h-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
  h1{font-size:17px; margin:0; letter-spacing:.3px}
  .h-sub{font-size:12px; color:var(--sub)}
  .tabs{display:flex; gap:6px; margin-top:10px}
  .tab{flex:1; text-align:center; font-size:14px; padding:8px 0; border-radius:10px; color:var(--sub);
    background:transparent; border:1px solid transparent; cursor:pointer}
  .tab.on{background:#fff; color:var(--teal); border-color:var(--line); box-shadow:var(--shadow); font-weight:600}
  main{padding:14px 16px 8px; max-width:680px; margin:0 auto}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:14px 16px}
  .muted{color:var(--sub); font-size:13px}
  .hidden{display:none !important}

  /* 记录按钮 */
  .rec-wrap{display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px 0 6px}
  .rec-btn{width:168px; height:168px; border-radius:50%; border:none; color:#fff; font-size:19px; font-weight:700;
    background:radial-gradient(circle at 30% 25%, #14b8a6, #0f766e 70%); box-shadow:0 12px 30px rgba(15,118,110,.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer}
  .rec-btn:active{transform:scale(.97)}
  .rec-btn small{font-weight:500; font-size:12px; opacity:.85}
  .tip{font-size:12px; color:var(--sub); text-align:center; line-height:1.6}

  /* 第二步面板 */
  .sheet-mask{position:fixed; inset:0; background:rgba(15,23,42,.42); z-index:50; display:flex; align-items:flex-end}
  .sheet{width:100%; background:#fff; border-radius:20px 20px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:88vh; overflow:auto; animation:up .22s ease}
  @keyframes up{from{transform:translateY(24px); opacity:.6} to{transform:none; opacity:1}}
  .sheet h2{margin:2px 0 2px; font-size:16px}
  .stamp{font-size:26px; font-weight:700; letter-spacing:.5px; margin:6px 0 2px}
  .stamp small{font-size:12px; color:var(--sub); font-weight:500; margin-left:6px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px}
  .chip{border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:9px 14px;
    font-size:14px; cursor:pointer}
  .chip.on{background:var(--teal-soft); border-color:#9ed7d0; color:#0b5f59; font-weight:600}
  .row{display:flex; align-items:center; gap:10px; margin-top:14px}
  .row label{font-size:13px; color:var(--sub); white-space:nowrap}
  input[type=range]{flex:1; accent-color:var(--teal)}
  .val{font-variant-numeric:tabular-nums; font-weight:700; min-width:28px; text-align:right}
  textarea{width:100%; margin-top:10px; border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    font:inherit; font-size:14px; resize:vertical; min-height:56px; background:#fbfbfc}
  .actions{display:flex; gap:10px; margin-top:16px}
  .btn{flex:1; border-radius:12px; padding:13px 0; font-size:15px; font-weight:600; border:1px solid var(--line);
    background:#fff; color:var(--ink); cursor:pointer}
  .btn.primary{background:var(--teal); border-color:var(--teal); color:#fff}
  .btn:active{transform:scale(.99)}

  /* 时间轴 */
  .day-head{display:flex; align-items:baseline; justify-content:space-between; margin:16px 2px 8px}
  .day-head b{font-size:14px}
  .day-head span{font-size:12px; color:var(--sub)}
  .entry{display:flex; gap:12px; padding:12px 0; border-bottom:1px dashed var(--line)}
  .entry:last-child{border-bottom:none}
  .t{font-variant-numeric:tabular-nums; font-weight:700; font-size:14px; min-width:46px; color:var(--ink)}
  .body{flex:1; min-width:0}
  .tags{display:flex; flex-wrap:wrap; gap:6px}
  .tag{font-size:12px; padding:3px 9px; border-radius:999px; background:#eef1f4; color:#374151}
  .tag.hi{background:#fee2e2; color:#991b1b}
  .tag.mid{background:#fef3c7; color:#92400e}
  .tag.ok{background:#dcfce7; color:#166534}
  .note{font-size:13px; color:var(--sub); margin-top:6px; line-height:1.5; word-break:break-word}
  .del{margin-left:auto; background:none; border:none; color:#c3c8cf; font-size:18px; cursor:pointer; padding:0 2px}

  /* 统计 */
  .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px}
  .kpi{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center; box-shadow:var(--shadow)}
  .kpi b{display:block; font-size:22px; font-variant-numeric:tabular-nums}
  .kpi span{font-size:11px; color:var(--sub)}
  .bar-row{display:flex; align-items:center; gap:10px; margin:8px 0}
  .bar-name{width:74px; font-size:13px; color:#374151; text-align:right}
  .bar-track{flex:1; height:10px; background:#eef1f4; border-radius:999px; overflow:hidden}
  .bar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,#14b8a6,#0f766e)}
  .bar-num{width:34px; font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums; text-align:right}
  .section-title{font-size:13px; color:var(--sub); margin:16px 2px 6px; letter-spacing:.4px}

  /* 底栏 */
  .bottom{position:fixed; left:0; right:0; bottom:0; z-index:30; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94); border-top:1px solid var(--line); backdrop-filter:blur(10px)}
  .bottom .btn{font-size:15px}
  .row2{display:flex; gap:10px}
  .ghost{background:#fff}
  .empty{text-align:center; color:var(--sub); font-size:14px; padding:36px 10px; line-height:1.8}
</style>
</head>
<body>

<header>
  <div class="h-row">
    <h1>情绪记录</h1>
    <div class="h-sub" id="todayCount">今天 0 次</div>
  </div>
  <div class="tabs">
    <button class="tab on" data-view="record">记录</button>
    <button class="tab" data-view="timeline">时间轴</button>
    <button class="tab" data-view="stats">统计</button>
  </div>
</header>

<main>
  <!-- 记录 -->
  <section id="view-record">
    <div class="rec-wrap">
      <button class="rec-btn" id="bigBtn">
        <span>现在</span>
        <small id="bigTime">--:--</small>
      </button>
      <div class="tip">点一下立刻记下这个时刻，<br>然后选一下当时的感觉。</div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="muted" id="lastInfo">还没有记录。</div>
    </div>
  </section>

  <!-- 时间轴 -->
  <section id="view-timeline" class="hidden">
    <div id="timelineBox"></div>
  </section>

  <!-- 统计 -->
  <section id="view-stats" class="hidden">
    <div class="tabs" style="margin:0 0 12px">
      <button class="tab on" data-range="7">近 7 天</button>
      <button class="tab" data-range="30">近 30 天</button>
      <button class="tab" data-range="90">近 90 天</button>
    </div>
    <div class="kpis">
      <div class="kpi"><b id="kCount">0</b><span>记录次数</span></div>
      <div class="kpi"><b id="kAvg">-</b><span>平均强度</span></div>
      <div class="kpi"><b id="kDays">0</b><span>记录天数</span></div>
    </div>
    <div class="card">
      <div class="section-title">情绪出现次数</div>
      <div id="tagBars"><div class="muted">暂无数据</div></div>
      <div class="section-title">一天中的分布</div>
      <div id="hourBars"><div class="muted">暂无数据</div></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="section-title">最常一起出现的组合</div>
      <div id="comboList"><div class="muted">暂无数据</div></div>
    </div>
  </section>
</main>

<div class="bottom">
  <div class="row2">
    <button class="btn ghost" id="exportBtn">给医生的报告</button>
    <button class="btn ghost" id="backupBtn">备份</button>
    <button class="btn ghost" id="restoreBtn">恢复</button>
  </div>
</div>

<!-- 第二步面板 -->
<div class="sheet-mask hidden" id="sheetMask">
  <div class="sheet" id="sheet">
    <h2>刚才的感觉</h2>
    <div class="stamp"><span id="sheetTime">10:32</span><small id="sheetDate">11月11日 周二</small></div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <label>强度</label>
      <input type="range" id="intensity" min="1" max="10" step="1" value="5">
      <div class="val" id="intensityVal">5</div>
    </div>
    <textarea id="noteBox" placeholder="补充一句（可选）：发生了什么？和谁？在做什么？"></textarea>
    <div class="actions">
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const KEY = "moodlog.v1";
  const TAGS = [
    ["焦虑", 1], ["抑郁/低落", 1], ["烦躁易怒", 2], ["失眠", 2],
    ["心悸/紧张", 2], ["躯体不适", 2], ["恐慌", 3], ["麻木/空", 2],
    ["平静", 0], ["开心", 0], ["疲惫", 2], ["其他", 2]
  ];
  const TAG_LEVEL = {}; TAGS.forEach(([n,l]) => TAG_LEVEL[n] = l);

  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,"0");
  const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ return []; } }
  function save(list){ localStorage.setItem(KEY, JSON.stringify(list)); }
  let data = load().sort((a,b) => a.ts - b.ts);

  function fmtTime(ts){ const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function fmtDate(ts){ const d = new Date(ts); return (d.getMonth()+1) + "月" + d.getDate() + "日"; }
  function dayKey(ts){ const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function fmtDayLabel(key){
    const [y,m,d] = key.split("-").map(Number);
    const dt = new Date(y, m-1, d);
    const today = new Date(); const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const diff = Math.round((t0 - dt) / 86400000);
    const base = m + "月" + d + "日 " + WEEK[dt.getDay()];
    if (diff === 0) return "今天 · " + base;
    if (diff === 1) return "昨天 · " + base;
    return base;
  }

  // ---------- 界面切换 ----------
  document.querySelectorAll(".tab[data-view]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab[data-view]").forEach(b => b.classList.toggle("on", b === btn));
      ["record","timeline","stats"].forEach(v => {
        $("#view-" + v).classList.toggle("hidden", v !== btn.dataset.view);
      });
      if (btn.dataset.view === "timeline") renderTimeline();
      if (btn.dataset.view === "stats") renderStats();
    });
  });

  // ---------- 第一步：点一下记时间 ----------
  let pending = null;
  function tick(){
    const now = new Date();
    $("#bigTime").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  }
  tick(); setInterval(tick, 20000);

  $("#bigBtn").addEventListener("click", () => {
    pending = Date.now();
    $("#sheetTime").textContent = fmtTime(pending);
    $("#sheetDate").textContent = fmtDate(pending) + " " + WEEK[new Date(pending).getDay()];
    document.querySelectorAll("#chips .chip").forEach(c => c.classList.remove("on"));
    $("#intensity").value = 5; $("#intensityVal").textContent = "5";
    $("#noteBox").value = "";
    $("#sheetMask").classList.remove("hidden");
  });

  // 情绪 chips
  const chipsBox = $("#chips");
  TAGS.forEach(([name]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = name; b.dataset.name = name;
    b.addEventListener("click", () => b.classList.toggle("on"));
    chipsBox.appendChild(b);
  });

  $("#intensity").addEventListener("input", e => { $("#intensityVal").textContent = e.target.value; });

  $("#cancelBtn").addEventListener("click", () => { pending = null; $("#sheetMask").classList.add("hidden"); });

  $("#saveBtn").addEventListener("click", () => {
    const tags = Array.from(document.querySelectorAll("#chips .chip.on")).map(c => c.dataset.name);
    const item = {
      id: "e" + (pending || Date.now()),
      ts: pending || Date.now(),
      tags: tags.length ? tags : ["未标注"],
      intensity: Number($("#intensity").value),
      note: $("#noteBox").value.trim()
    };
    data.push(item); data.sort((a,b) => a.ts - b.ts); save(data);
    pending = null;
    $("#sheetMask").classList.add("hidden");
    refreshHome();
    // 给个轻提示
    const btn = $("#bigBtn");
    btn.querySelector("span").textContent = "已记录 ✓";
    setTimeout(() => btn.querySelector("span").textContent = "现在", 1200);
  });

  // ---------- 首页 ----------
  function refreshHome(){
    const today = dayKey(Date.now());
    const n = data.filter(x => dayKey(x.ts) === today).length;
    $("#todayCount").textContent = "今天 " + n + " 次";
    if (!data.length){ $("#lastInfo").textContent = "还没有记录。第一次点上面的按钮试试。"; return; }
    const last = data[data.length - 1];
    $("#lastInfo").textContent = "上一次：" + fmtDate(last.ts) + " " + fmtTime(last.ts)
      + " · " + last.tags.join("、") + " · 强度 " + last.intensity;
  }

  // ---------- 时间轴 ----------
  function tagClass(name){
    const lv = TAG_LEVEL[name];
    if (lv === 3) return "tag hi";
    if (lv === 2) return "tag mid";
    if (lv === 0) return "tag ok";
    return "tag";
  }

  function renderTimeline(){
    const box = $("#timelineBox");
    if (!data.length){ box.innerHTML = '<div class="empty">还没有记录。<br>回到「记录」点一下按钮。</div>'; return; }
    const groups = {};
    data.slice().reverse().forEach(it => {
      const k = dayKey(it.ts);
      (groups[k] = groups[k] || []).push(it);
    });
    let html = "";
    Object.keys(groups).sort().reverse().forEach(k => {
      const list = groups[k];
      const avg = (list.reduce((s,x) => s + x.intensity, 0) / list.length).toFixed(1);
      html += '<div class="day-head"><b>' + fmtDayLabel(k) + '</b><span>' + list.length + " 次 · 平均强度 " + avg + "</span></div>";
      html += '<div class="card">';
      list.forEach(it => {
        html += '<div class="entry">'
          + '<div class="t">' + fmtTime(it.ts) + "</div>"
          + '<div class="body"><div class="tags">'
          + it.tags.map(t => '<span class="' + tagClass(t) + '">' + t + "</span>").join("")
          + '<span class="tag">强度 ' + it.intensity + "</span>"
          + "</div>"
          + (it.note ? '<div class="note">' + escapeHtml(it.note) + "</div>" : "")
          + "</div>"
          + '<button class="del" data-id="' + it.id + '" title="删除">×</button>'
          + "</div>";
      });
      html += "</div>";
    });
    box.innerHTML = html;
    box.querySelectorAll(".del").forEach(b => {
      b.addEventListener("click", () => {
        if (!confirm("删除这条记录？")) return;
        data = data.filter(x => x.id !== b.dataset.id); save(data);
        renderTimeline(); refreshHome();
      });
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- 统计 ----------
  let rangeDays = 7;
  document.querySelectorAll(".tab[data-range]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab[data-range]").forEach(b => b.classList.toggle("on", b === btn));
      rangeDays = Number(btn.dataset.range);
      renderStats();
    });
  });

  function renderStats(){
    const from = Date.now() - rangeDays * 86400000;
    const list = data.filter(x => x.ts >= from);
    $("#kCount").textContent = list.length;
    $("#kDays").textContent = new Set(list.map(x => dayKey(x.ts))).size;
    $("#kAvg").textContent = list.length ? (list.reduce((s,x) => s + x.intensity, 0) / list.length).toFixed(1) : "-";

    // 标签计数
    const cnt = {};
    list.forEach(x => x.tags.forEach(t => cnt[t] = (cnt[t] || 0) + 1));
    const arr = Object.entries(cnt).sort((a,b) => b[1] - a[1]).slice(0, 8);
    $("#tagBars").innerHTML = arr.length ? arr.map(([name, n]) => {
      const max = arr[0][1];
      return '<div class="bar-row"><div class="bar-name">' + name + "</div>"
        + '<div class="bar-track"><div class="bar-fill" style="width:' + (n / max * 100) + '%"></div></div>'
        + '<div class="bar-num">' + n + "</div></div>";
    }).join("") : '<div class="muted">暂无数据</div>';

    // 时段分布（早 5-11 / 午 11-17 / 晚 17-22 / 夜 22-5）
    const buckets = [["早 5–11", 0], ["午 11–17", 0], ["晚 17–22", 0], ["夜 22–5", 0]];
    list.forEach(x => {
      const h = new Date(x.ts).getHours();
      if (h >= 5 && h < 11) buckets[0][1]++;
      else if (h >= 11 && h < 17) buckets[1][1]++;
      else if (h >= 17 && h < 22) buckets[2][1]++;
      else buckets[3][1]++;
    });
    const bmax = Math.max(1, ...buckets.map(b => b[1]));
    $("#hourBars").innerHTML = buckets.map(([name, n]) =>
      '<div class="bar-row"><div class="bar-name">' + name + "</div>"
      + '<div class="bar-track"><div class="bar-fill" style="width:' + (n / bmax * 100) + '%"></div></div>'
      + '<div class="bar-num">' + n + "</div></div>").join("");

    // 组合
    const combo = {};
    list.forEach(x => {
      if (x.tags.length < 2) return;
      const k = x.tags.slice().sort().join(" + ");
      combo[k] = (combo[k] || 0) + 1;
    });
    const carr = Object.entries(combo).sort((a,b) => b[1] - a[1]).slice(0, 3);
    $("#comboList").innerHTML = carr.length
      ? carr.map(([k, n]) => '<div class="bar-row"><div class="bar-name" style="width:auto;text-align:left;flex:1">' + k + "</div>"
          + '<div class="bar-num">' + n + " 次</div></div>").join("")
      : '<div class="muted">还没有多标签记录</div>';
  }

  // ---------- 导出给医生的报告 ----------
  $("#exportBtn").addEventListener("click", () => {
    if (!data.length){ alert("还没有记录，先记两条再导出。"); return; }
    const now = new Date();
    const from = now.getTime() - 30 * 86400000;
    const list = data.filter(x => x.ts >= from);

    const cnt = {};
    list.forEach(x => x.tags.forEach(t => cnt[t] = (cnt[t] || 0) + 1));
    const top = Object.entries(cnt).sort((a,b) => b[1] - a[1]);
    const days = {};
    list.forEach(x => { const k = dayKey(x.ts); (days[k] = days[k] || []).push(x); });

    let rows = "";
    Object.keys(days).sort().reverse().forEach(k => {
      days[k].forEach(it => {
        rows += "<tr><td>" + k + "</td><td>" + fmtTime(it.ts) + "</td><td>"
          + it.tags.join("、") + "</td><td>" + it.intensity + "</td><td>"
          + (it.note ? escapeHtml(it.note) : "") + "</td></tr>";
      });
    });

    const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width,initial-scale=1">'
      + "<title>情绪记录 · 近 30 天</title><style>"
      + "body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;margin:24px;color:#111}"
      + "h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:24px 0 8px}"
      + ".sub{color:#666;font-size:12px;margin-bottom:16px}"
      + "table{border-collapse:collapse;width:100%;font-size:13px}"
      + "th,td{border-bottom:1px solid #e5e7eb;padding:7px 8px;text-align:left;vertical-align:top}"
      + "th{background:#f9fafb;color:#374151;font-weight:600}"
      + ".k{display:inline-block;margin-right:18px;font-size:13px}"
      + "@media print{body{margin:12mm}}"
      + "</style></head><body>"
      + "<h1>情绪记录汇总（近 30 天）</h1>"
      + '<div class="sub">生成时间：' + now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate())
      + " " + pad(now.getHours()) + ":" + pad(now.getMinutes())
      + "　·　共 " + list.length + " 次记录，覆盖 " + Object.keys(days).length + " 天　·　本记录由本人自行填写</div>"
      + "<h2>概况</h2><div>"
      + '<span class="k">记录次数：<b>' + list.length + "</b></span>"
      + '<span class="k">记录天数：<b>' + Object.keys(days).length + "</b></span>"
      + '<span class="k">平均强度：<b>' + (list.length ? (list.reduce((s,x) => s + x.intensity, 0) / list.length).toFixed(1) : "-") + "</b>/10</span>"
      + "</div>"
      + "<h2>最常见的感觉</h2><div>"
      + (top.length ? top.slice(0, 8).map(([k, n]) => '<span class="k">' + k + "：<b>" + n + "</b> 次</span>").join("") : "—")
      + "</div>"
      + "<h2>逐条记录</h2><table><thead><tr>"
      + "<th>日期</th><th>时间</th><th>感觉</th><th>强度</th><th>备注</th>"
      + "</tr></thead><tbody>" + rows + "</tbody></table>"
      + '<div class="sub" style="margin-top:24px">说明：本表为个人主观感受记录，非医学诊断依据。</div>'
      + "</body></html>";

    const w = window.open("", "_blank");
    if (w){ w.document.write(html); w.document.close(); }
    else { alert("浏览器拦截了新窗口，请允许弹窗后再试。"); }
  });

  // ---------- 备份 / 恢复 ----------
  $("#backupBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(data, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "情绪记录备份_" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  });

  $("#restoreBtn").addEventListener("click", () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.addEventListener("change", () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const arr = JSON.parse(r.result);
          if (!Array.isArray(arr)) throw new Error("格式不对");
          const ids = new Set(data.map(x => x.id));
          let add = 0;
          arr.forEach(x => { if (x && x.ts && !ids.has(x.id)) { data.push(x); add++; } });
          data.sort((a,b) => a.ts - b.ts); save(data);
          refreshHome(); renderTimeline(); renderStats();
          alert("已导入 " + add + " 条记录");
        } catch(e){ alert("导入失败：" + e.message); }
      };
      r.readAsText(f);
    });
    inp.click();
  });

  // ---------- 初始化 ----------
  refreshHome();
  renderTimeline();
  renderStats();

  // 注册 service worker（离线可用）
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
